name: Build and Release MorpheX Live

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.1)'
        required: true
        default: 'v0.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Restore Dependencies
        run: |
          dotnet restore src/MorpheX/MorpheX.csproj

      - name: Publish MorpheX Standalone Executable
        run: |
          dotnet publish src/MorpheX/MorpheX.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:PublishReadyToRun=false -o ./publish
          Remove-Item -Path ./publish/*.pdb, ./publish/*.xml, ./publish/libvlc/win-x64/*.lib, ./publish/libvlc/win-x64/vlc-cache-gen.exe -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish/libvlc/win-x64/lua, ./publish/libvlc/win-x64/hrtfs, ./publish/runtimes -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish/libvlc/win-arm64, ./publish/libvlc/win-x86 -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/access_output, ./publish/libvlc/win-x64/plugins/stream_out, ./publish/libvlc/win-x64/plugins/mux, ./publish/libvlc/win-x64/plugins/services_discovery, ./publish/libvlc/win-x64/plugins/keystore, ./publish/libvlc/win-x64/plugins/visualization, ./publish/libvlc/win-x64/plugins/video_splitter, ./publish/libvlc/win-x64/plugins/gui, ./publish/libvlc/win-x64/plugins/spu, ./publish/libvlc/win-x64/plugins/meta_engine, ./publish/libvlc/win-x64/plugins/control, ./publish/libvlc/win-x64/plugins/notify -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/access/libdcp_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libaccess_srt_plugin.dll, ./publish/libvlc/win-x64/plugins/access/librist_plugin.dll, ./publish/libvlc/win-x64/plugins/access/liblibbluray_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libcdda_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libdtv_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libsftp_plugin.dll, ./publish/libvlc/win-x64/plugins/access/*.jar, ./publish/libvlc/win-x64/plugins/access/librtp_plugin.dll, ./publish/libvlc/win-x64/plugins/access/liblive555_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libnfs_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libvcd_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libvdr_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libsatip_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libdvd*.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/codec/libzvbi_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libgme_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libx264*.dll, ./publish/libvlc/win-x64/plugins/codec/libaom_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libtwolame_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libshine_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libschroedinger_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libdaala_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libspatialaudio_plugin.dll, ./publish/libvlc/win-x64/plugins/video_output/libcaca_plugin.dll, ./publish/libvlc/win-x64/plugins/video_filter/libpuzzle_plugin.dll, ./publish/libvlc/win-x64/plugins/video_filter/libball_plugin.dll, ./publish/libvlc/win-x64/plugins/video_filter/libpsychedelic_plugin.dll, ./publish/libvlc/win-x64/plugins/video_filter/libanaglyph_plugin.dll, ./publish/libvlc/win-x64/plugins/video_filter/libripple_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libsdl_image_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libtheora_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libvorbis_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libspeex_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libfluidsynth_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libmod_plugin.dll -Force -ErrorAction SilentlyContinue
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/text_renderer, ./publish/libvlc/win-x64/plugins/demux/libadaptive_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libdvdnav_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libdvdread_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libvcd_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libgme_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libmod_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libsid_plugin.dll, ./publish/libvlc/win-x64/plugins/access/libaccess_output_*.dll -Recurse -Force -ErrorAction SilentlyContinue
          # --- Safe extras: packetizers (fully covered by libavformat/ffmpeg) ---
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/packetizer -Recurse -Force -ErrorAction SilentlyContinue
          # --- Safe extras: redundant standalone codecs (fully covered by libavcodec/ffmpeg) ---
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/codec/liba52_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libdts_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libfaad_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libmpg123_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/liblibmpeg2_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libjpeg_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libpng_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libaraw_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libcdg_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libwebvtt_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libttml_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libsubsdec_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libcc_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/liblibass_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libdav1d_plugin.dll, ./publish/libvlc/win-x64/plugins/codec/libqsv_plugin.dll -Force -ErrorAction SilentlyContinue
          # --- Safe extras: unused demuxers (subtitles, playlists, podcasts, image galleries) ---
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/demux/libsubtitle_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libplaylist_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libpodcast_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/librawaud_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/librawvid_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libnsc_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libdemux_cdg_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libimage_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libaiff_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libau_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libvoc_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libxa_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libdemux_stl_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libnuv_plugin.dll, ./publish/libvlc/win-x64/plugins/demux/libts_plugin.dll -Force -ErrorAction SilentlyContinue
          # --- Safe extras: unused audio DSP filters (we use WASAPI loopback, not VLC audio processing) ---
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/audio_filter/libequalizer_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libchorus_flanger_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libcompressor_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libkaraoke_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libnormvol_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libparam_eq_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libremap_plugin.dll, ./publish/libvlc/win-x64/plugins/audio_filter/libstereo_widen_plugin.dll -Force -ErrorAction SilentlyContinue
          # --- Safe extras: unused video outputs (keep d3d11 + d3d9 fallback only) ---
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/video_output/libgl_plugin.dll, ./publish/libvlc/win-x64/plugins/video_output/libopengl_plugin.dll, ./publish/libvlc/win-x64/plugins/video_output/libvmem_plugin.dll, ./publish/libvlc/win-x64/plugins/video_output/libflaschen_plugin.dll -Force -ErrorAction SilentlyContinue
          # --- Safe extras: unused networking TLS, XML, archive stream filters ---
          Remove-Item -Path ./publish/libvlc/win-x64/plugins/misc/libgnutls_plugin.dll, ./publish/libvlc/win-x64/plugins/misc/libxml_plugin.dll, ./publish/libvlc/win-x64/plugins/stream_filter/libarchive_plugin.dll -Force -ErrorAction SilentlyContinue
          # --- Log publish size for CI diagnostics ---
          $publishSizeMB = (Get-ChildItem -Path ./publish -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Publish folder size after stripping: $([math]::Round($publishSizeMB, 2)) MB"
          Get-ChildItem -Path ./publish -Directory | Where-Object { (Get-ChildItem $_.FullName -Recurse -File).Count -eq 0 } | Remove-Item -Recurse -Force

      - name: Compile Inno Setup Installer
        run: |
          $ver = "${{ github.event.inputs.tag_name || github.ref_name }}".TrimStart('v')
          if (-not $ver) { $ver = "0.1.9" }
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DMyAppVersion=$ver" installer.iss

      - name: Generate SHA-256 Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $sidecarPath = "$($_.FullName).sha256"
            Set-Content -Path $sidecarPath -Value "$hash  $($_.Name)" -NoNewline
            Write-Host "Generated SHA-256 for $($_.Name): $hash"
          }

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MorpheX-Installer
          path: |
            dist/*.exe
            dist/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: MorpheX Live ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/*.exe
            dist/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Deploy Installer to GitHub Pages Docs
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          # Step 1: Find installer and copy to TEMP
          $setup = Get-ChildItem -Path dist/*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $setup) { Write-Host "No installer found in dist/. Skipping deploy."; exit 0 }
          $installerName = $setup.Name
          $tempPath = Join-Path $env:TEMP $installerName
          Copy-Item -Path $setup.FullName -Destination $tempPath -Force
          $fileSizeMB = (Get-Item $tempPath).Length / 1MB
          Write-Host "Saved installer to: $tempPath ($([math]::Round($fileSizeMB, 2)) MB)"

          # Check 100MB limit before attempting git push
          if ($fileSizeMB -gt 99.5) {
            Write-Host "Warning: Installer size ($([math]::Round($fileSizeMB, 2)) MB) exceeds GitHub 100MB git limit. Skipping commit to docs/ to prevent push rejection."
            exit 0
          }

          # Step 2: Switch to main branch
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth 1
          git checkout -B main origin/main

          # Step 3: Remove old installers, copy in new one
          Remove-Item -Path "docs/MorpheX-Live-Setup-*.exe" -Force -ErrorAction SilentlyContinue
          Copy-Item -Path $tempPath -Destination "docs/$installerName" -Force

          # Step 4: Commit and push
          git add -A docs/
          $staged = (git diff --cached --name-only).Trim()
          if ($staged) {
            git commit -m "release: deploy $installerName to GitHub Pages [skip ci]"
            git push origin main
            Write-Host "Deployed $installerName to docs/"
          }
